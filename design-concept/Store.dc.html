<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500;600;700;900&family=Manrope:wght@500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: Manrope, "Helvetica Neue", system-ui, sans-serif; }
    a { color: #ffd84d; } a:hover { color: #ffe89a; }
    .dsp { font-family: Gabarito, Manrope, system-ui, sans-serif; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #150f2c; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 58px 20px 0; display: flex; justify-content: space-between; align-items: flex-end;">
    <div>
      <div class="dsp" style="color: #fff; font-size: 30px; font-weight: 700; letter-spacing: -0.8px;">Store</div>
      <div style="color: rgba(255,255,255,0.4); font-size: 12.5px; font-weight: 500; margin-top: 2px;">Eight sets of dice to collect</div>
    </div>
    <div style="display: flex; align-items: center; gap: 7px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.11); border-radius: 12px; padding: 8px 12px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#ffc247" stroke-width="1.9"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/></svg>
      <span style="color: #fff; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums;">420</span>
    </div>
  </div>

  <div style="flex-grow: 1; padding: 22px 20px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-content: start;">

    <div style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px;">
      <div style="height: 84px; border-radius: 13px; background: linear-gradient(150deg, #3a3448 0%, #232030 100%); display: grid; place-items: center;">
        <div style="width: 46px; height: 46px; border-radius: 11px; background: linear-gradient(140deg, #f6f3ec 0%, #ddd8cd 100%); box-shadow: 0 5px 14px rgba(0,0,0,0.4); position: relative;">
          <div style="position: absolute; inset: 0; border-radius: 11px; background: repeating-linear-gradient(118deg, rgba(120,128,140,0.5) 0 3px, transparent 3px 9px);"></div>
        </div>
      </div>
      <div>
        <div class="dsp" style="color: #fff; font-size: 15px; font-weight: 600;">Marble</div>
        <div style="display: flex; align-items: center; gap: 5px; margin-top: 5px;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#ffc247" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/></svg>
          <span style="color: #ffc247; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;">500</span>
        </div>
      </div>
    </div>

    <div style="background: rgba(255,216,77,0.09); border: 1px solid rgba(255,216,77,0.28); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px;">
      <div style="height: 84px; border-radius: 13px; background: linear-gradient(150deg, #4a3f28 0%, #2a2418 100%); display: grid; place-items: center;">
        <div style="width: 46px; height: 46px; border-radius: 11px; background: linear-gradient(128deg, #6e5836 0%, #ffe9a8 42%, #d9a63f 62%, #6e5836 100%); box-shadow: 0 5px 14px rgba(0,0,0,0.4);"></div>
      </div>
      <div>
        <div class="dsp" style="color: #fff; font-size: 15px; font-weight: 600;">Gold</div>
        <div style="display: flex; align-items: center; gap: 5px; margin-top: 5px;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M9 20h6M12 14v6"/></svg>
          <span style="color: rgba(255,255,255,0.5); font-size: 12.5px; font-weight: 600;">100 trophies</span>
        </div>
      </div>
    </div>

    <div style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px;">
      <div style="height: 84px; border-radius: 13px; background: linear-gradient(150deg, #2f3a44 0%, #1d2429 100%); display: grid; place-items: center;">
        <div style="width: 46px; height: 46px; border-radius: 11px; background: linear-gradient(128deg, #8f9aa4 0%, #ffffff 44%, #b9c2ca 62%, #8f9aa4 100%); box-shadow: 0 5px 14px rgba(0,0,0,0.4);"></div>
      </div>
      <div>
        <div class="dsp" style="color: #fff; font-size: 15px; font-weight: 600;">Silver</div>
        <div style="display: flex; align-items: center; gap: 5px; margin-top: 5px;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#ffc247" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/></svg>
          <span style="color: #ffc247; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;">650</span>
        </div>
      </div>
    </div>

    <div style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px;">
      <div style="height: 84px; border-radius: 13px; background: linear-gradient(150deg, #26384a 0%, #16212c 100%); display: grid; place-items: center;">
        <div style="width: 46px; height: 46px; border-radius: 11px; background: #e8f5ff; box-shadow: 0 5px 14px rgba(0,0,0,0.4); position: relative; overflow: hidden;">
          <div style="position: absolute; left: 9px; top: 9px; width: 12px; height: 2px; background: #9fd3f0;"></div>
          <div style="position: absolute; left: 14px; top: 4px; width: 2px; height: 12px; background: #9fd3f0;"></div>
          <div style="position: absolute; left: 26px; top: 27px; width: 14px; height: 2px; background: #9fd3f0;"></div>
          <div style="position: absolute; left: 32px; top: 21px; width: 2px; height: 14px; background: #9fd3f0;"></div>
        </div>
      </div>
      <div>
        <div class="dsp" style="color: #fff; font-size: 15px; font-weight: 600;">Frost</div>
        <div style="display: flex; align-items: center; gap: 5px; margin-top: 5px;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#ffc247" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/></svg>
          <span style="color: #ffc247; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;">350</span>
        </div>
      </div>
    </div>

  </div>

  <div style="padding: 0 20px 34px;">
    <div style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09); border-radius: 16px; padding: 14px 16px; display: flex; align-items: center; gap: 11px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.9" stroke-linecap="round" style="flex: none;"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
      <div style="color: rgba(255,255,255,0.55); font-size: 12.5px; line-height: 1.4; font-weight: 500;">Tap any set to see it on the real board before you buy.</div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
