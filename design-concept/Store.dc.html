<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: Nunito, "Helvetica Neue", system-ui, sans-serif; }
    a { color: #d2451e; } a:hover { color: #1d1a2e; }
    .dsp { font-family: Fredoka, Nunito, system-ui, sans-serif; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #fdf6ec; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 58px 20px 0; display: flex; justify-content: space-between; align-items: flex-end;">
    <div>
      <div class="dsp" style="color: #1d1a2e; font-size: 30px; font-weight: 700; letter-spacing: -0.6px;">Store</div>
      <div style="color: rgba(29,26,46,0.6); font-size: 12.5px; font-weight: 700; margin-top: 1px;">Eight sets to collect</div>
    </div>
    <div style="display: flex; align-items: center; gap: 7px; background: #ffffff; border: 2px solid #1d1a2e; border-radius: 14px; padding: 8px 12px; box-shadow: 0 3px 0 #1d1a2e;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#ffd21f" stroke-width="2.4"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/></svg>
      <span style="color: #1d1a2e; font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums;">420</span>
    </div>
  </div>

  <div style="flex-grow: 1; padding: 22px 20px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-content: start;">

    <div style="background: #ffffff; border: 2px solid #1d1a2e; border-radius: 18px; padding: 13px; box-shadow: 0 4px 0 #1d1a2e; display: flex; flex-direction: column; gap: 11px;">
      <div style="height: 80px; border-radius: 12px; background: #f5ece0; display: grid; place-items: center;">
        <div style="width: 48px; height: 48px; border-radius: 13px; background: linear-gradient(140deg, #f6f3ec 0%, #d3cec2 100%); border: 2px solid #1d1a2e; box-shadow: 0 4px 0 #1d1a2e; "></div>
      </div>
      <div>
        <div class="dsp" style="color: #1d1a2e; font-size: 16px; font-weight: 700;">Marble</div>
        <div style="display: flex; align-items: center; gap: 5px; margin-top: 4px;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#ffd21f" stroke-width="2.6"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/></svg>
          <span style="color: #1d1a2e; font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums;">500</span>
        </div>
      </div>
    </div>

    <div style="background: #ffd21f; border: 2px solid #1d1a2e; border-radius: 18px; padding: 13px; box-shadow: 0 4px 0 #1d1a2e; display: flex; flex-direction: column; gap: 11px;">
      <div style="height: 80px; border-radius: 12px; background: rgba(29,26,46,0.12); display: grid; place-items: center;">
        <div style="width: 48px; height: 48px; border-radius: 13px; background: linear-gradient(128deg, #6e5836 0%, #ffe9a8 42%, #d9a63f 62%, #6e5836 100%); border: 2px solid #1d1a2e; box-shadow: 0 4px 0 #1d1a2e; "></div>
      </div>
      <div>
        <div class="dsp" style="color: #1d1a2e; font-size: 16px; font-weight: 700;">Gold</div>
        <div style="color: rgba(29,26,46,0.7); font-size: 12px; font-weight: 800; margin-top: 4px;">100 trophies</div>
      </div>
    </div>

    <div style="background: #ffffff; border: 2px solid #1d1a2e; border-radius: 18px; padding: 13px; box-shadow: 0 4px 0 #1d1a2e; display: flex; flex-direction: column; gap: 11px;">
      <div style="height: 80px; border-radius: 12px; background: #f5ece0; display: grid; place-items: center;">
        <div style="width: 48px; height: 48px; border-radius: 13px; background: linear-gradient(128deg, #8f9aa4 0%, #ffffff 44%, #b9c2ca 62%, #8f9aa4 100%); border: 2px solid #1d1a2e; box-shadow: 0 4px 0 #1d1a2e; "></div>
      </div>
      <div>
        <div class="dsp" style="color: #1d1a2e; font-size: 16px; font-weight: 700;">Silver</div>
        <div style="display: flex; align-items: center; gap: 5px; margin-top: 4px;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#ffd21f" stroke-width="2.6"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/></svg>
          <span style="color: #1d1a2e; font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums;">650</span>
        </div>
      </div>
    </div>

    <div style="background: #ffffff; border: 2px solid #1d1a2e; border-radius: 18px; padding: 13px; box-shadow: 0 4px 0 #1d1a2e; display: flex; flex-direction: column; gap: 11px;">
      <div style="height: 80px; border-radius: 12px; background: #f5ece0; display: grid; place-items: center;">
        <div style="width: 48px; height: 48px; border-radius: 13px; background: #e8f5ff; border: 2px solid #1d1a2e; box-shadow: 0 4px 0 #1d1a2e; position: relative; overflow: hidden;"></div>
      </div>
      <div>
        <div class="dsp" style="color: #1d1a2e; font-size: 16px; font-weight: 700;">Frost</div>
        <div style="display: flex; align-items: center; gap: 5px; margin-top: 4px;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#ffd21f" stroke-width="2.6"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/></svg>
          <span style="color: #1d1a2e; font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums;">350</span>
        </div>
      </div>
    </div>

  </div>

  <div style="padding: 0 20px 30px;">
    <div style="background: #efe4d4; border-radius: 15px; padding: 14px 16px; display: flex; align-items: center; gap: 11px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="rgba(29,26,46,0.6)" stroke-width="2.2" stroke-linecap="round" style="flex: none;"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
      <div style="color: rgba(29,26,46,0.6); font-size: 12.5px; line-height: 1.4; font-weight: 700;">Tap any set to see it on the real board first.</div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
