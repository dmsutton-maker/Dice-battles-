<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500;600;700;900&family=Manrope:wght@500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: Manrope, "Helvetica Neue", system-ui, sans-serif; }
    a { color: #ffd84d; } a:hover { color: #ffe89a; }
    .dsp { font-family: Gabarito, Manrope, system-ui, sans-serif; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background:
     radial-gradient(110% 50% at 50% 22%, #3f2f6b 0%, #241a44 46%, #150f2c 100%);
     display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; padding: 0 24px; overflow: hidden;">

  <div style="width: 76px; height: 76px; border-radius: 26px; background: linear-gradient(180deg, #ffe268 0%, #ffc93a 100%); display: grid; place-items: center; box-shadow: 0 14px 38px rgba(255,201,58,0.32);">
    <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#241a44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3"/><path d="M7 5H4v2a3 3 0 0 0 3 3"/><path d="M9 20h6"/><path d="M12 14v6"/></svg>
  </div>

  <div class="dsp" style="color: #fff; font-size: 38px; font-weight: 700; letter-spacing: -1px; margin-top: 22px;">Victory</div>
  <div style="color: rgba(255,255,255,0.5); font-size: 14px; font-weight: 500; margin-top: 4px;">Color Rush · Medium</div>

  <div style="align-self: stretch; display: flex; align-items: center; justify-content: center; gap: 26px; margin-top: 28px; padding: 20px 0; background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px;">
    <div style="text-align: center;">
      <div class="dsp" style="color: #fff; font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums;">6</div>
      <div style="color: rgba(255,255,255,0.42); font-size: 11px; font-weight: 600; margin-top: 2px;">You</div>
    </div>
    <div style="width: 1px; height: 34px; background: rgba(255,255,255,0.1);"></div>
    <div style="text-align: center;">
      <div class="dsp" style="color: rgba(255,255,255,0.5); font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums;">4</div>
      <div style="color: rgba(255,255,255,0.42); font-size: 11px; font-weight: 600; margin-top: 2px;">Rusty</div>
    </div>
  </div>

  <div style="align-self: stretch; display: flex; gap: 10px; margin-top: 12px;">
    <div style="flex-grow: 1; flex-basis: 0; background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.08); border-radius: 17px; padding: 15px;">
      <div style="display: flex; align-items: center; gap: 6px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffd84d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M9 20h6M12 14v6"/></svg>
        <span style="color: rgba(255,255,255,0.45); font-size: 11.5px; font-weight: 600;">Trophies</span>
      </div>
      <div class="dsp" style="color: #fff; font-size: 23px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums;">128 <span style="color: #62dd97; font-size: 15px; font-weight: 600;">+18</span></div>
    </div>
    <div style="flex-grow: 1; flex-basis: 0; background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.08); border-radius: 17px; padding: 15px;">
      <div style="display: flex; align-items: center; gap: 6px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffc247" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/></svg>
        <span style="color: rgba(255,255,255,0.45); font-size: 11.5px; font-weight: 600;">Coins</span>
      </div>
      <div class="dsp" style="color: #fff; font-size: 23px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums;">420 <span style="color: #62dd97; font-size: 15px; font-weight: 600;">+35</span></div>
    </div>
  </div>

  <div style="align-self: stretch; margin-top: 12px; background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.08); border-radius: 17px; padding: 15px 16px;">
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <span style="color: rgba(255,255,255,0.45); font-size: 11.5px; font-weight: 600;">Next unlock · Jungle Clearing</span>
      <span style="color: rgba(255,255,255,0.7); font-size: 11.5px; font-weight: 700; font-variant-numeric: tabular-nums;">128 / 290</span>
    </div>
    <div style="height: 6px; border-radius: 3px; background: rgba(255,255,255,0.09); margin-top: 10px; overflow: hidden;">
      <div style="width: 44%; height: 6px; border-radius: 3px; background: linear-gradient(90deg, #ffc93a, #ffe268);"></div>
    </div>
  </div>

  <div style="align-self: stretch; margin-top: 26px; background: linear-gradient(180deg, #ffe268 0%, #ffc93a 100%); border-radius: 19px; padding: 18px; text-align: center; box-shadow: 0 10px 28px rgba(255,201,58,0.26);">
    <span class="dsp" style="color: #241a44; font-size: 19px; font-weight: 700;">Play again</span>
  </div>
  <div style="align-self: stretch; margin-top: 10px; border: 1px solid rgba(255,255,255,0.14); border-radius: 19px; padding: 16px; text-align: center;">
    <span style="color: rgba(255,255,255,0.75); font-size: 15px; font-weight: 600;">Home</span>
  </div>

</div>
</x-dc>
</body>
</html>
