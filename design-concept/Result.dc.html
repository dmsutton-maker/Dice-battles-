<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: Nunito, "Helvetica Neue", system-ui, sans-serif; }
    a { color: #d2451e; } a:hover { color: #1d1a2e; }
    .dsp { font-family: Fredoka, Nunito, system-ui, sans-serif; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #fdf6ec; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 24px; overflow: hidden;">

  <div style="width: 84px; height: 84px; border-radius: 26px; background: #ffd21f; border: 3px solid #1d1a2e; box-shadow: 0 6px 0 #1d1a2e; display: grid; place-items: center;">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#1d1a2e" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3"/><path d="M7 5H4v2a3 3 0 0 0 3 3"/><path d="M9 20h6"/><path d="M12 14v6"/></svg>
  </div>

  <div class="dsp" style="color: #1d1a2e; font-size: 40px; font-weight: 700; letter-spacing: -1px; margin-top: 22px;">Victory</div>
  <div style="color: rgba(29,26,46,0.6); font-size: 14px; font-weight: 700; margin-top: 2px;">Color Rush · Medium</div>

  <div style="align-self: stretch; display: flex; align-items: center; justify-content: center; gap: 30px; margin-top: 26px; padding: 18px 0; background: #ffffff; border: 2px solid #1d1a2e; border-radius: 20px; box-shadow: 0 4px 0 #1d1a2e;">
    <div style="text-align: center;">
      <div class="dsp" style="color: #1d1a2e; font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums;">6</div>
      <div style="color: rgba(29,26,46,0.6); font-size: 11px; font-weight: 800; margin-top: 1px;">You</div>
    </div>
    <div style="width: 2px; height: 34px; background: #1d1a2e;"></div>
    <div style="text-align: center;">
      <div class="dsp" style="color: rgba(29,26,46,0.6); font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums;">4</div>
      <div style="color: rgba(29,26,46,0.6); font-size: 11px; font-weight: 800; margin-top: 1px;">Rusty</div>
    </div>
  </div>

  <div style="align-self: stretch; display: flex; gap: 10px; margin-top: 12px;">
    <div style="flex-grow: 1; flex-basis: 0; background: #ffffff; border: 2px solid #1d1a2e; border-radius: 17px; padding: 14px; box-shadow: 0 4px 0 #1d1a2e;">
      <div style="color: rgba(29,26,46,0.6); font-size: 11.5px; font-weight: 800;">Trophies</div>
      <div class="dsp" style="color: #1d1a2e; font-size: 23px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums;">128 <span style="color: #1c7a48; font-size: 15px;">+18</span></div>
    </div>
    <div style="flex-grow: 1; flex-basis: 0; background: #ffffff; border: 2px solid #1d1a2e; border-radius: 17px; padding: 14px; box-shadow: 0 4px 0 #1d1a2e;">
      <div style="color: rgba(29,26,46,0.6); font-size: 11.5px; font-weight: 800;">Coins</div>
      <div class="dsp" style="color: #1d1a2e; font-size: 23px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums;">420 <span style="color: #1c7a48; font-size: 15px;">+35</span></div>
    </div>
  </div>

  <div style="align-self: stretch; margin-top: 12px; background: #ffffff; border: 2px solid #1d1a2e; border-radius: 17px; padding: 15px 16px; box-shadow: 0 4px 0 #1d1a2e;">
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <span style="color: rgba(29,26,46,0.6); font-size: 11.5px; font-weight: 800;">Next · Jungle Clearing</span>
      <span style="color: #1d1a2e; font-size: 11.5px; font-weight: 800; font-variant-numeric: tabular-nums;">128 / 290</span>
    </div>
    <div style="height: 10px; border-radius: 5px; background: #efe4d4; border: 2px solid #1d1a2e; margin-top: 9px; overflow: hidden;">
      <div style="width: 44%; height: 6px; background: #ffd21f;"></div>
    </div>
  </div>

  <div style="align-self: stretch; margin-top: 24px; background: #d2451e; border: 2px solid #1d1a2e; border-radius: 20px; padding: 18px; text-align: center; box-shadow: 0 6px 0 #1d1a2e;">
    <span class="dsp" style="color: #ffffff; font-size: 21px; font-weight: 700;">Play again</span>
  </div>
  <div style="align-self: stretch; margin-top: 10px; background: #ffffff; border: 2px solid #1d1a2e; border-radius: 20px; padding: 16px; text-align: center; box-shadow: 0 4px 0 #1d1a2e;">
    <span style="color: #1d1a2e; font-size: 16px; font-weight: 800;">Home</span>
  </div>

</div>
