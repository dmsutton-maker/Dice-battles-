<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500;600;700;900&family=Manrope:wght@500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: Manrope, "Helvetica Neue", system-ui, sans-serif; }
    a { color: #ffd84d; } a:hover { color: #ffe89a; }
    .dsp { font-family: Gabarito, Manrope, system-ui, sans-serif; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background:
     radial-gradient(120% 62% at 50% 8%, #3b2a63 0%, #241a44 42%, #150f2c 100%);
     display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <div style="position: absolute; top: 96px; left: 50%; transform: translateX(-50%); width: 300px; height: 300px; border-radius: 150px; background: radial-gradient(circle, rgba(255,216,77,0.16) 0%, rgba(255,216,77,0) 68%);"></div>

  <div style="display: flex; justify-content: space-between; align-items: center; padding: 58px 20px 0; position: relative;">
    <div style="display: flex; gap: 10px;">
      <div style="display: flex; align-items: center; gap: 7px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.11); border-radius: 12px; padding: 7px 12px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#ffd84d" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3"/><path d="M7 5H4v2a3 3 0 0 0 3 3"/><path d="M10 19h4"/><path d="M12 14v5"/></svg>
        <span style="color: #fff; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums;">128</span>
      </div>
      <div style="display: flex; align-items: center; gap: 7px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.11); border-radius: 12px; padding: 7px 12px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#ffc247" stroke-width="1.9"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/></svg>
        <span style="color: #fff; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums;">420</span>
      </div>
    </div>
    <div style="display: flex; gap: 8px;">
      <div style="width: 36px; height: 36px; border-radius: 12px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.11); display: grid; place-items: center;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.72)" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .9-1 1.6v.4"/><path d="M12 17h.01"/></svg>
      </div>
      <div style="width: 36px; height: 36px; border-radius: 12px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.11); display: grid; place-items: center;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.72)" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="3.4"/><path d="M12 2.6v3M12 18.4v3M21.4 12h-3M5.6 12h-3M18.6 5.4l-2.1 2.1M7.5 16.5l-2.1 2.1M18.6 18.6l-2.1-2.1M7.5 7.5 5.4 5.4"/></svg>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; padding: 0 22px; position: relative;">

    <div style="display: flex; gap: 7px; margin-bottom: 22px;">
      <div style="width: 15px; height: 15px; border-radius: 5px; background: #cc2533;"></div>
      <div style="width: 15px; height: 15px; border-radius: 5px; background: #fc8403;"></div>
      <div style="width: 15px; height: 15px; border-radius: 5px; background: #ffe521;"></div>
      <div style="width: 15px; height: 15px; border-radius: 5px; background: #33cc6b;"></div>
      <div style="width: 15px; height: 15px; border-radius: 5px; background: #4a72ff;"></div>
      <div style="width: 15px; height: 15px; border-radius: 5px; background: #cc79fc;"></div>
    </div>

    <div class="dsp" style="color: #fff; font-size: 46px; font-weight: 900; letter-spacing: -1.6px; line-height: 0.94; text-align: center;">Dice<br>Battles</div>
    <div style="color: rgba(255,255,255,0.44); font-size: 12px; font-weight: 700; letter-spacing: 3.4px; text-transform: uppercase; margin-top: 10px;">Color Rush</div>

    <div style="align-self: stretch; margin-top: 40px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09); border-radius: 20px; padding: 6px; display: flex; gap: 4px;">
      <div style="flex-grow: 1; flex-basis: 0; text-align: center; padding: 14px 0; border-radius: 15px; background: rgba(255,255,255,0.11); color: #fff; font-size: 13.5px; font-weight: 700;">Rush</div>
      <div style="flex-grow: 1; flex-basis: 0; text-align: center; padding: 14px 0; border-radius: 15px; color: rgba(255,255,255,0.5); font-size: 13.5px; font-weight: 600;">Ultimate</div>
      <div style="flex-grow: 1; flex-basis: 0; text-align: center; padding: 14px 0; border-radius: 15px; color: rgba(255,255,255,0.5); font-size: 13.5px; font-weight: 600;">Skirmish</div>
      <div style="flex-grow: 1; flex-basis: 0; text-align: center; padding: 14px 0; border-radius: 15px; color: rgba(255,255,255,0.5); font-size: 13.5px; font-weight: 600;">War</div>
    </div>

    <div style="align-self: stretch; display: flex; align-items: center; justify-content: space-between; margin-top: 14px; padding: 0 4px;">
      <div style="color: rgba(255,255,255,0.44); font-size: 12.5px; font-weight: 600;">Opponent</div>
      <div style="display: flex; gap: 6px;">
        <div style="padding: 13px 15px; border-radius: 12px; color: rgba(255,255,255,0.5); font-size: 12.5px; font-weight: 600;">Easy</div>
        <div style="padding: 13px 15px; border-radius: 12px; background: #ffd84d; color: #201636; font-size: 12.5px; font-weight: 800;">Medium</div>
        <div style="padding: 13px 15px; border-radius: 12px; color: rgba(255,255,255,0.5); font-size: 12.5px; font-weight: 600;">Hard</div>
      </div>
    </div>

    <div style="align-self: stretch; display: flex; align-items: flex-start; gap: 9px; margin-top: 16px; padding: 13px 15px; background: rgba(255,255,255,0.04); border-radius: 15px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#ffd84d" stroke-width="2" stroke-linecap="round" style="flex: none; margin-top: 1px;"><path d="M4 18l6-9 4 5 2-3 4 7z"/></svg>
      <div style="color: rgba(255,255,255,0.66); font-size: 12.5px; line-height: 1.45; font-weight: 500;">A hill in a new spot every battle — the dice bounce off it.</div>
    </div>

    <div style="align-self: stretch; margin-top: 26px; background: linear-gradient(180deg, #ffe268 0%, #ffc93a 100%); border-radius: 19px; padding: 18px; text-align: center; box-shadow: 0 10px 28px rgba(255,201,58,0.28);">
      <span class="dsp" style="color: #241a44; font-size: 19px; font-weight: 700; letter-spacing: -0.2px;">Start battle</span>
    </div>
  </div>

  <div style="display: flex; background: rgba(16,11,32,0.72); border-top: 1px solid rgba(255,255,255,0.07); padding: 12px 0 30px;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.42)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z"/><path d="M9 7V5.5a3 3 0 0 1 6 0V7"/></svg>
      <span style="color: rgba(255,255,255,0.42); font-size: 10px; font-weight: 600;">Store</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.42)" stroke-width="1.8" stroke-linejoin="round"><path d="M4 8.5 12 4l8 4.5v7L12 20l-8-4.5z"/><path d="M4 8.5 12 13l8-4.5M12 13v7"/></svg>
      <span style="color: rgba(255,255,255,0.42); font-size: 10px; font-weight: 600;">Items</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <div style="width: 40px; height: 26px; border-radius: 9px; background: rgba(255,216,77,0.15); display: grid; place-items: center;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#ffd84d" stroke-width="1.9" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><circle cx="8.6" cy="8.6" r="1.5" fill="#ffd84d" stroke="none"/><circle cx="15.4" cy="15.4" r="1.5" fill="#ffd84d" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="#ffd84d" stroke="none"/></svg>
      </div>
      <span style="color: #ffd84d; font-size: 10px; font-weight: 700;">Battle</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.42)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3"/><path d="M7 5H4v2a3 3 0 0 0 3 3"/><path d="M9 20h6"/><path d="M12 14v6"/></svg>
      <span style="color: rgba(255,255,255,0.42); font-size: 10px; font-weight: 600;">Cups</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.42)" stroke-width="1.8" stroke-linecap="round"><path d="M5 20V11"/><path d="M12 20V4"/><path d="M19 20v-6"/></svg>
      <span style="color: rgba(255,255,255,0.42); font-size: 10px; font-weight: 600;">Ranks</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
