<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500;600;700;900&family=Manrope:wght@500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: Manrope, "Helvetica Neue", system-ui, sans-serif; }
    a { color: #ffd84d; } a:hover { color: #ffe89a; }
    .dsp { font-family: Gabarito, Manrope, system-ui, sans-serif; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: linear-gradient(180deg, #2b2350 0%, #1a1436 100%); display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <div style="display: flex; justify-content: space-between; align-items: center; padding: 56px 16px 0;">
    <div style="display: flex; align-items: center; gap: 9px; background: rgba(10,7,22,0.5); border: 1px solid rgba(255,255,255,0.09); border-radius: 14px; padding: 8px 12px;">
      <span style="color: rgba(255,255,255,0.5); font-size: 11px; font-weight: 600;">You</span>
      <div style="display: flex; gap: 4px;">
        <div style="width: 9px; height: 9px; border-radius: 3px; background: #cc2533;"></div>
        <div style="width: 9px; height: 9px; border-radius: 3px; background: #fc8403;"></div>
        <div style="width: 9px; height: 9px; border-radius: 3px; background: rgba(255,255,255,0.14);"></div>
        <div style="width: 9px; height: 9px; border-radius: 3px; background: rgba(255,255,255,0.14);"></div>
        <div style="width: 9px; height: 9px; border-radius: 3px; background: rgba(255,255,255,0.14);"></div>
        <div style="width: 9px; height: 9px; border-radius: 3px; background: rgba(255,255,255,0.14);"></div>
      </div>
    </div>
    <div style="width: 36px; height: 36px; border-radius: 12px; background: rgba(10,7,22,0.5); border: 1px solid rgba(255,255,255,0.09); display: grid; place-items: center;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round"><path d="M9 5v14M15 5v14"/></svg>
    </div>
    <div style="display: flex; align-items: center; gap: 9px; background: rgba(10,7,22,0.5); border: 1px solid rgba(255,255,255,0.09); border-radius: 14px; padding: 8px 12px;">
      <div style="display: flex; gap: 4px;">
        <div style="width: 9px; height: 9px; border-radius: 3px; background: #33cc6b;"></div>
        <div style="width: 9px; height: 9px; border-radius: 3px; background: rgba(255,255,255,0.14);"></div>
        <div style="width: 9px; height: 9px; border-radius: 3px; background: rgba(255,255,255,0.14);"></div>
        <div style="width: 9px; height: 9px; border-radius: 3px; background: rgba(255,255,255,0.14);"></div>
        <div style="width: 9px; height: 9px; border-radius: 3px; background: rgba(255,255,255,0.14);"></div>
        <div style="width: 9px; height: 9px; border-radius: 3px; background: rgba(255,255,255,0.14);"></div>
      </div>
      <span style="color: rgba(255,255,255,0.5); font-size: 11px; font-weight: 600;">Rusty</span>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative;">
    <div style="width: 250px; height: 400px; border-radius: 30px; background: linear-gradient(170deg, #5c8b45 0%, #3f6b31 60%, #35592a 100%); box-shadow: inset 0 0 70px rgba(0,0,0,0.34), 0 26px 60px rgba(0,0,0,0.45); border: 6px solid #6b4a2c; position: relative; display: grid; place-items: center;">
      <div style="display: flex; gap: 22px;">
        <div style="width: 62px; height: 62px; border-radius: 15px; background: linear-gradient(140deg, #ffffff 0%, #e6e2d8 100%); box-shadow: 0 12px 24px rgba(0,0,0,0.42); display: grid; place-items: center;">
          <div style="width: 32px; height: 32px; border-radius: 16px; background: #33cc6b;"></div>
        </div>
        <div style="width: 62px; height: 62px; border-radius: 15px; background: linear-gradient(140deg, #ffffff 0%, #e6e2d8 100%); box-shadow: 0 12px 24px rgba(0,0,0,0.42); display: grid; place-items: center;">
          <div style="width: 32px; height: 32px; border-radius: 16px; background: #33cc6b;"></div>
        </div>
      </div>
    </div>

    <div style="position: absolute; top: 96px; display: flex; align-items: center; gap: 9px; background: rgba(51,204,107,0.16); border: 1px solid rgba(51,204,107,0.4); backdrop-filter: blur(8px); border-radius: 999px; padding: 10px 18px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#62dd97" stroke-width="2.2" stroke-linecap="round"><path d="M7 11V8a5 5 0 0 1 9.5-2"/><rect x="5" y="11" width="14" height="9" rx="2.5"/></svg>
      <span class="dsp" style="color: #eafff2; font-size: 15px; font-weight: 600;">Green goes free!</span>
    </div>
  </div>

  <div style="padding: 0 24px 42px; display: flex; flex-direction: column; align-items: center; gap: 14px;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.32)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>
      <span style="color: rgba(255,255,255,0.42); font-size: 13px; font-weight: 500;">Tap to roll · swipe to throw</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
