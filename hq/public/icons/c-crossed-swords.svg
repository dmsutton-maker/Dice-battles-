<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="A die in front of two crossed swords">
  <title>Crossed Swords</title>
  <defs>
    <linearGradient id="c-bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#3d2f78"/>
      <stop offset="1" stop-color="#120d24"/>
    </linearGradient>
    <radialGradient id="c-glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#ffe521" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#ffe521" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="c-blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d99b4"/>
      <stop offset="0.45" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#7c88a4"/>
    </linearGradient>
    <linearGradient id="c-shell" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#d9d1bf"/>
    </linearGradient>
    <linearGradient id="c-face" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#e8394a"/>
      <stop offset="1" stop-color="#b41c2a"/>
    </linearGradient>
    <filter id="c-drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#05030f" flood-opacity="0.62"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#c-bg)"/>
  <rect width="1024" height="1024" fill="url(#c-glow)"/>

  <!-- One sword, defined pointing straight up, then used twice at ±45°.
       Long and thick on purpose: a thin blade turns to grey mush at the
       size an icon is actually seen. -->
  <defs>
    <g id="c-sword">
      <path d="M512 18 L566 152 L458 152 Z" fill="#ffffff"/>
      <rect x="458" y="134" width="108" height="576" rx="12" fill="url(#c-blade)"/>
      <rect x="378" y="698" width="268" height="50" rx="24" fill="#c9971d"/>
      <rect x="478" y="742" width="68" height="176" rx="30" fill="#6b4a1c"/>
    </g>
  </defs>

  <g filter="url(#c-drop)">
    <use href="#c-sword" transform="rotate(45 512 512)"/>
    <use href="#c-sword" transform="rotate(-45 512 512)"/>
  </g>

  <!-- The die sits over the crossing point, small enough that the X
       still reads as two swords. -->
  <g filter="url(#c-drop)">
    <rect x="356" y="406" width="312" height="312" rx="66" fill="url(#c-shell)"/>
    <rect x="410" y="460" width="204" height="204" rx="42" fill="url(#c-face)"/>
    <rect x="410" y="460" width="204" height="92" rx="40" fill="#ffffff" opacity="0.18"/>
  </g>
</svg>
